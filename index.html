</body><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho principal -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">8º Ano — Estudante Exemplo</p>
    </header>

    <!-- Área de Cards de Resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="card-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="card-frequencia" class="valor-card">92%</p>
        <span class="legenda-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <main class="secao-tabela">
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As 15 linhas de disciplinas serão inseridas aqui automaticamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
